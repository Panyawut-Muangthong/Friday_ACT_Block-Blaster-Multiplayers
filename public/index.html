<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101115">
  <title>Block Blaster · Duel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="background" aria-hidden="true"></canvas>

  <div class="wrap">
    <!-- Navigation / Header -->
    <header>
      <div class="brand">
        <span class="mark">▦</span>BLOCK BLASTER
      </div>
      <div class="header-actions">
        <span id="connection" role="status"></span>
        <button id="sound" class="quiet" aria-label="Toggle sound">♪ ON</button>
        <button id="language" class="quiet">ไทย</button>
      </div>
    </header>

    <main>
      <!-- Lobby View -->
      <section id="lobby" class="lobby-layout">
        <div class="intro">
          <div class="eyebrow" data-i18n="eyebrow"></div>
          <h1 id="hero"></h1>
          <p class="lead" data-i18n="lead"></p>
          <div class="steps">
            <div class="step">
              <b>01</b><span data-i18n="step1"></span>
            </div>
            <div class="step">
              <b>02</b><span data-i18n="step2"></span>
            </div>
            <div class="step">
              <b>03</b><span data-i18n="step3"></span>
            </div>
          </div>
        </div>

        <div class="panel">
          <!-- Join / Create Room Form -->
          <form id="join-form">
            <h2 data-i18n="enter"></h2>
            <label for="name" data-i18n="name"></label>
            <input id="name" maxlength="24" autocomplete="nickname" required>

            <label for="code" data-i18n="roomCode"></label>
            <div class="row">
              <input id="code" minlength="3" maxlength="16" pattern="[A-Za-z0-9-]{3,16}" autocomplete="off" required>
              <button type="button" id="generate" data-i18n="generate"></button>
            </div>
            <p class="note" data-i18n="codeHelp"></p>
            <button class="primary wide" id="join" data-i18n="join"></button>
          </form>

          <!-- Waiting Room Panel -->
          <div id="waiting" hidden>
            <div class="row">
              <div>
                <div class="eyebrow" data-i18n="roomCode"></div>
                <div class="room-code" id="room-code"></div>
              </div>
              <button id="leave" class="quiet" data-i18n="leave"></button>
            </div>

            <div id="presence"></div>
            <p id="waiting-note" class="note"></p>

            <!-- Host Configuration Form (Auto-Saved) -->
            <form id="config" class="config">
              <h2 class="divider" data-i18n="rules"></h2>

              <!-- Mode Selection -->
              <div class="mode-container">
                <label data-i18n="mode"></label>
                <div class="mode-buttons">
                  <button type="button" id="mode-timed" class="mode-btn active" data-i18n="modeTimed">⏱ Timed</button>
                  <button type="button" id="mode-endless" class="mode-btn" data-i18n="modeEndless">♾ Endless</button>
                </div>
              </div>

              <!-- Timed Settings -->
              <div id="timed-config" class="row" style="margin-top: 14px;">
                <div>
                  <label for="target" data-i18n="target"></label>
                  <input id="target" type="number" min="100" max="100000" value="1200" required>
                </div>
                <div>
                  <label for="duration" data-i18n="duration"></label>
                  <input id="duration" type="number" min="30" max="3600" value="180" required>
                </div>
              </div>

              <div id="config-status" class="config-status" data-i18n="autoSaved">✓ Synced in real-time</div>
            </form>

            <button id="start" class="primary wide" data-i18n="start"></button>
            <p class="note" data-i18n="grace"></p>
          </div>
        </div>
      </section>

      <!-- Arena View -->
      <section id="arena" hidden>
        <div class="arena-top">
          <h2 data-i18n="duel"></h2>
          <div class="row">
            <button id="reset-field" class="quiet reset-btn" data-i18n="resetField">↺ Reset Field</button>
            <button id="back" class="quiet" data-i18n="back" hidden></button>
            <button id="arena-leave" class="quiet" data-i18n="leave"></button>
          </div>
        </div>

        <!-- Metric HUD -->
        <div class="hud">
          <div class="metric">
            <small data-i18n="time"></small>
            <strong id="time"></strong>
          </div>
          <div class="metric">
            <small data-i18n="target"></small>
            <strong id="target-hud"></strong>
          </div>
          <div class="metric">
            <small data-i18n="status"></small>
            <strong id="status"></strong>
          </div>
        </div>

        <!-- Game Result Banner -->
        <div id="result" class="banner" role="status" hidden></div>

        <!-- Player Boards -->
        <div id="boards" class="duel"></div>

        <p class="note" style="text-align: center" data-i18n="scoring"></p>
      </section>
    </main>

    <footer data-i18n="footer"></footer>
  </div>

  <div id="toast" role="alert" hidden></div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
