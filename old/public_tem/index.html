<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Block Blaster Duel</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* Ghost overlay previews */
    .cell.preview-valid {
      background: rgba(16, 185, 129, 0.45) !important;
      outline: 2px dashed #10b981;
    }

    .cell.preview-invalid {
      background: rgba(239, 68, 68, 0.45) !important;
      outline: 2px dashed #ef4444;
    }

    :root {
      --bg: #0b1329;
      --panel: #1e293b;
      --panel-item: #111b2e;
      --primary: #38bdf8;
      --p1: #00d2ff;
      --p2: #ff416c;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      opacity: 0.22;
      pointer-events: none;
    }

    header {
      position: relative;
      text-align: center;
      margin-bottom: 14px;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary);
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .top-controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 10px;
    }

    .lang-toggle,
    .btn-leave {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }

    .lang-toggle:hover {
      border-color: var(--primary);
    }

    .btn-leave {
      border-color: var(--danger);
      color: #fca5a5;
    }

    .btn-leave:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .card {
      background: var(--panel);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .btn {
      background: var(--primary);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-action {
      background: var(--accent);
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #090e19;
      color: #fff;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .config-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .config-field {
      flex: 1;
      min-width: 130px;
    }

    .config-field label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .player-tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin: 2px;
    }

    .ready-tag {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .offline-tag {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    /* Duel Arena Grid */
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .hud-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .hud-box .label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .hud-box .val {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 2px;
    }

    .duel-columns {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 820px) {
      .duel-columns {
        grid-template-columns: 1fr 1fr;
      }
    }

    .player-zone {
      background: var(--panel-item);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid var(--border);
    }

    .p1-border {
      border-color: rgba(0, 210, 255, 0.4);
    }

    .p2-border {
      border-color: rgba(255, 65, 108, 0.4);
    }

    .player-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 3px;
      width: 300px;
      height: 300px;
      background: #090e19;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .cell {
      background: #16243b;
      border-radius: 3px;
      cursor: pointer;
    }

    .cell.p1-filled {
      background: var(--p1);
      box-shadow: 0 0 6px var(--p1);
    }

    .cell.p2-filled {
      background: var(--p2);
      box-shadow: 0 0 6px var(--p2);
    }

    .rack {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      min-height: 70px;
    }

    .piece-preview {
      display: grid;
      gap: 2px;
      padding: 6px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .piece-preview.selected {
      border-color: #fff;
      transform: scale(1.08);
    }

    .preview-cell {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }
  </style>
</head>

<body>
  <canvas id="matrix-canvas"></canvas>

  <div class="container">
    <div class="top-controls">
      <button class="btn-leave" id="btn-leave" style="display: none;" onclick="leaveRoom()">
        🚪 <span id="ui-leave-btn">Leave Game</span>
      </button>
      <button class="lang-toggle" onclick="toggleLanguage()">
        🌐 <span id="lang-btn-text">TH (ภาษาไทย)</span>
      </button>
    </div>

    <header>
      <h1 id="ui-title">Block Blaster Duel</h1>
      <p id="ui-subtitle">Blast lines simultaneously, outscore your opponent, and race to the victory target!</p>
    </header>

    <!-- Lobby Screen -->
    <div id="screen-lobby" class="card">
      <h2 style="margin-bottom: 10px;" id="ui-join-title">Join Game</h2>
      <input type="text" id="join-name" placeholder="Your Name" />
      <input type="text" id="join-room" placeholder="Room Code (e.g. DUEL)" />
      <button class="btn btn-action" style="width: 100%;" onclick="joinRoom()" id="ui-join-btn">Enter Game</button>
    </div>

    <!-- Waiting Screen -->
    <div id="screen-waiting" class="card" style="display: none;">
      <h2><span id="ui-room-label">Room</span>: <span id="waiting-room-code" style="color: var(--primary)"></span></h2>
      <div id="host-settings"
        style="display: none; margin: 12px 0; border: 1px dashed var(--border); padding: 12px; border-radius: 8px;">
        <h4 style="margin-bottom: 8px; color: var(--accent);" id="ui-host-title">Host Game Rules</h4>
        <div class="config-group">
          <div class="config-field">
            <label id="ui-lbl-targetscore">Winning Target Score</label>
            <input type="number" id="input-target-score" value="1200" min="300" step="100" onchange="syncSettings()" />
          </div>
          <div class="config-field">
            <label id="ui-lbl-duration">Match Duration (Seconds)</label>
            <input type="number" id="input-duration" value="180" min="30" max="600" step="10"
              onchange="syncSettings()" />
          </div>
        </div>
      </div>

      <div id="client-settings-view" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;"></div>
      <div id="waiting-player-list" style="margin: 10px 0;"></div>
      <button id="btn-start" class="btn btn-action" style="display:none; width:100%;" onclick="startGame()">Start
        Match</button>
      <span id="waiting-msg" style="color: var(--text-muted); font-size: 0.9rem;">Waiting for host to start...</span>
    </div>

    <!-- Live Game Screen -->
    <div id="screen-game" style="display: none;">
      <div class="card">
        <div class="hud-grid">
          <div class="hud-box">
            <div class="label" id="ui-label-timer">Time Left</div>
            <div class="val" id="hud-timer" style="color: #38bdf8;">180s</div>
          </div>
          <div class="hud-box">
            <div class="label" id="ui-label-target">Target Score</div>
            <div class="val" id="hud-target" style="color: var(--accent);">1200</div>
          </div>
          <div class="hud-box">
            <div class="label" id="ui-label-status">Status</div>
            <div class="val" id="hud-status" style="color: var(--success); font-size: 1rem; margin-top: 4px;">Active
            </div>
          </div>
        </div>
      </div>

      <div class="duel-columns">
        <!-- Player 1 -->
        <div class="player-zone p1-border">
          <div class="player-meta">
            <span style="color: var(--p1);" id="p1-name">Player 1</span>
            <span id="p1-score">0 pts</span>
          </div>
          <div class="board" id="board-p1"></div>
          <div class="rack" id="rack-p1"></div>
        </div>

        <!-- Player 2 -->
        <div class="player-zone p2-border">
          <div class="player-meta">
            <span style="color: var(--p2);" id="p2-name">Player 2</span>
            <span id="p2-score">0 pts</span>
          </div>
          <div class="board" id="board-p2"></div>
          <div class="rack" id="rack-p2"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Dynamic Grey Background: "Enemy Cooking" Matrix ---
    const bgCanvas = document.getElementById("matrix-canvas");
    const bgCtx = bgCanvas.getContext("2d");
    function resizeBg() { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
    window.addEventListener("resize", resizeBg);
    resizeBg();

    const fallingBlocks = Array.from({ length: 28 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: 16 + Math.random() * 24,
      speed: 0.4 + Math.random() * 1.2
    }));

    function drawMatrix() {
      bgCtx.fillStyle = "#0b1329";
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.fillStyle = "#222f46";
      fallingBlocks.forEach(b => {
        b.y += b.speed;
        if (b.y > bgCanvas.height + 40) { b.y = -40; b.x = Math.random() * bgCanvas.width; }
        bgCtx.fillRect(b.x, b.y, b.size, b.size);
      });
      requestAnimationFrame(drawMatrix);
    }
    drawMatrix();

    // --- Localization ---
    let currentLang = 'th';
    const I18N = {
      en: {
        toggleBtn: 'TH (ภาษาไทย)',
        leaveBtn: 'Leave Game',
        title: 'Block Blaster Duel',
        subtitle: 'Blast lines simultaneously, outscore your opponent, and race to the victory target!',
        joinTitle: 'Join Duel Room',
        joinBtn: 'Enter Game',
        namePlaceholder: 'Your Name',
        roomPlaceholder: 'Room Code (e.g. DUEL)',
        roomLabel: 'Room',
        startBtn: 'Start Match',
        waitingHost: 'Waiting for host to start...',
        hostTitle: 'Host Game Rules',
        lblTargetScore: 'Winning Target Score',
        lblDuration: 'Match Duration (Seconds)',
        labelTimer: 'Time Left',
        labelTarget: 'Target Score',
        labelStatus: 'Status',
        statusActive: 'Active',
        statusCooking: 'Enemy cooking pieces...',
        winnerAlert: '🏆 VICTORY! {name} reached {score} pts!'
      },
      th: {
        toggleBtn: 'EN (English)',
        leaveBtn: 'ออกจากห้อง',
        title: 'ศึกระเบิดบล็อก: แข่งขันความเร็ว',
        subtitle: 'ระเบิดแถวบล็อกไปพร้อมกัน ทำคะแนนแซงคู่แข่ง และทำแต้มสู่เป้าหมายเพื่อชัยชนะ!',
        joinTitle: 'เข้าสู่ห้องแข่งขัน',
        joinBtn: 'เข้าเล่นเกม',
        namePlaceholder: 'ชื่อของคุณ',
        roomPlaceholder: 'รหัสห้อง (เช่น DUEL)',
        roomLabel: 'ห้อง',
        startBtn: 'เริ่มการแข่งขัน',
        waitingHost: 'กำลังรอหัวหน้าห้องเริ่มเกม...',
        hostTitle: 'ตั้งค่าการแข่งขัน (เฉพาะหัวหน้าห้อง)',
        lblTargetScore: 'เป้าหมายคะแนนเพื่อชนะ',
        lblDuration: 'เวลาแข่งขัน (วินาที)',
        labelTimer: 'เวลาที่เหลือ',
        labelTarget: 'คะแนนเป้าหมาย',
        labelStatus: 'สถานะ',
        statusActive: 'กำลังแข่งขัน',
        statusCooking: 'ศัตรูกำลังจัดบล็อก...',
        winnerAlert: '🏆 ชัยชนะ! {name} ทำคะแนนทะลุเป้าหมายที่ {score} คะแนน!'
      }
    };

    function t(key) { return I18N[currentLang][key] || key; }

    function toggleLanguage() {
      currentLang = (currentLang === 'en') ? 'th' : 'en';
      applyLanguageStatic();
      renderUI();
    }

    function applyLanguageStatic() {
      document.getElementById('lang-btn-text').innerText = t('toggleBtn');
      document.getElementById('ui-leave-btn').innerText = t('leaveBtn');
      document.getElementById('ui-title').innerText = t('title');
      document.getElementById('ui-subtitle').innerText = t('subtitle');
      document.getElementById('ui-join-title').innerText = t('joinTitle');
      document.getElementById('ui-join-btn').innerText = t('joinBtn');
      document.getElementById('join-name').placeholder = t('namePlaceholder');
      document.getElementById('join-room').placeholder = t('roomPlaceholder');
      document.getElementById('ui-room-label').innerText = t('roomLabel');
      document.getElementById('btn-start').innerText = t('startBtn');
      document.getElementById('waiting-msg').innerText = t('waitingHost');
      document.getElementById('ui-host-title').innerText = t('hostTitle');
      document.getElementById('ui-lbl-targetscore').innerText = t('lblTargetScore');
      document.getElementById('ui-lbl-duration').innerText = t('lblDuration');
      document.getElementById('ui-label-timer').innerText = t('labelTimer');
      document.getElementById('ui-label-target').innerText = t('labelTarget');
      document.getElementById('ui-label-status').innerText = t('labelStatus');
      document.getElementById('hud-status').innerText = t('statusActive');
    }

    // --- Audio Feedback Engine ---
    let audioCtx = null;
    function ensureAudioUnlocked() {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) { }
    }
    window.addEventListener('click', ensureAudioUnlocked, { passive: true });
    window.addEventListener('touchstart', ensureAudioUnlocked, { passive: true });

    function playBeep(freq = 440, duration = 0.08) {
      try {
        ensureAudioUnlocked();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { }
    }

    // --- Sockets & Client State ---
    const socket = io();
    let roomState = null;
    let localPlayerId = sessionStorage.getItem('bb_player_id');
    let savedRoomId = sessionStorage.getItem('bb_room_id');
    let savedPlayerName = sessionStorage.getItem('bb_player_name');
    let selectedPieceIndex = null;

    function joinRoom() {
      ensureAudioUnlocked();
      const name = document.getElementById('join-name').value.trim() || savedPlayerName;
      const room = document.getElementById('join-room').value.trim() || savedRoomId;
      if (!room) return alert(currentLang === 'th' ? "กรุณาใส่รหัสห้อง!" : "Please enter a room code!");

      sessionStorage.setItem('bb_room_id', room);
      if (name) sessionStorage.setItem('bb_player_name', name);

      socket.emit('join_room', {
        roomId: room,
        playerName: name,
        playerId: localPlayerId
      });
    }

    function leaveRoom() {
      const confirmLeave = confirm(currentLang === 'th' ? "ต้องการออกจากเกมใช่หรือไม่?" : "Are you sure you want to leave the game?");
      if (!confirmLeave) return;

      socket.emit('leave_room');
      sessionStorage.removeItem('bb_room_id');
      resetToLobby();
    }

    function resetToLobby() {
      roomState = null;
      document.getElementById('screen-lobby').style.display = 'block';
      document.getElementById('screen-waiting').style.display = 'none';
      document.getElementById('screen-game').style.display = 'none';
      document.getElementById('btn-leave').style.display = 'none';
    }

    function syncSettings() {
      const targetScore = document.getElementById('input-target-score').value;
      const matchDuration = document.getElementById('input-duration').value;
      socket.emit('update_room_settings', { targetScore, matchDuration });
    }

    function startGame() {
      ensureAudioUnlocked();
      socket.emit('start_game');
    }

    socket.on('session_created', ({ playerId, roomId }) => {
      localPlayerId = playerId;
      sessionStorage.setItem('bb_player_id', playerId);
      sessionStorage.setItem('bb_room_id', roomId);
    });

    socket.on('timer_tick', ({ timeLeft }) => {
      if (roomState) roomState.timeLeft = timeLeft;
      document.getElementById('hud-timer').innerText = `${timeLeft}s`;
    });

    socket.on('left_room_success', () => resetToLobby());
    socket.on('error_msg', (msg) => { alert(msg); resetToLobby(); });

    socket.on('room_update', (data) => {
      roomState = data;
      document.getElementById('btn-leave').style.display = 'inline-flex';

      if (data.winner) {
        alert(t('winnerAlert').replace('{name}', data.winner).replace('{score}', data.targetScore));
      }

      if (!data.started) {
        document.getElementById('screen-lobby').style.display = 'none';
        document.getElementById('screen-waiting').style.display = 'block';
        document.getElementById('screen-game').style.display = 'none';
        document.getElementById('waiting-room-code').innerText = data.roomId;

        document.getElementById('waiting-player-list').innerHTML = Object.values(data.players).map(p => `
          <div class="player-tag ${p.connected ? 'ready-tag' : 'offline-tag'}">${p.name} (${p.score} pts)</div>
        `).join('');

        const isHost = data.hostId === localPlayerId;
        const hostPanel = document.getElementById('host-settings');
        const clientSettings = document.getElementById('client-settings-view');

        if (isHost) {
          hostPanel.style.display = 'block';
          clientSettings.style.display = 'none';
          document.getElementById('btn-start').style.display = 'inline-block';
          document.getElementById('waiting-msg').style.display = 'none';
        } else {
          hostPanel.style.display = 'none';
          clientSettings.style.display = 'block';
          clientSettings.innerText = `Target: ${data.targetScore} pts | Match Length: ${data.matchDuration}s`;
          document.getElementById('btn-start').style.display = 'none';
          document.getElementById('waiting-msg').style.display = 'inline';
        }
      } else {
        document.getElementById('screen-lobby').style.display = 'none';
        document.getElementById('screen-waiting').style.display = 'none';
        document.getElementById('screen-game').style.display = 'block';
        renderUI();
      }
    });

    function renderUI() {
      if (!roomState) return;

      document.getElementById('hud-target').innerText = roomState.targetScore;
      document.getElementById('hud-timer').innerText = `${roomState.timeLeft}s`;

      const me = roomState.players[localPlayerId];
      const p1 = Object.values(roomState.players).find(p => p.role === 'p1');
      const p2 = Object.values(roomState.players).find(p => p.role === 'p2');

      document.getElementById('p1-name').textContent = p1 ? `${p1.name} ${p1.id === localPlayerId ? "(You)" : ""}` : "Waiting for Player 1...";
      document.getElementById('p2-name').textContent = p2 ? `${p2.name} ${p2.id === localPlayerId ? "(You)" : ""}` : "Waiting for Player 2...";
      document.getElementById('p1-score').textContent = `${p1 ? p1.score : 0} pts`;
      document.getElementById('p2-score').textContent = `${p2 ? p2.score : 0} pts`;

      renderBoard('p1', p1 ? p1.board : null, me?.role === 'p1');
      renderBoard('p2', p2 ? p2.board : null, me?.role === 'p2');

      renderRack('p1', p1 ? p1.rack : [], me?.role === 'p1');
      renderRack('p2', p2 ? p2.rack : [], me?.role === 'p2');
    }

    function clearPreviewOverlay(boardEl) {
      boardEl.querySelectorAll('.cell').forEach(cell => {
        cell.classList.remove('preview-valid', 'preview-invalid');
      });
    }

    function renderBoard(role, board, isMe) {
      const boardEl = document.getElementById(`board-${role}`);
      boardEl.innerHTML = "";

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.row = r;
          cell.dataset.col = c;
          if (board && board[r][c] === 1) cell.classList.add(`${role}-filled`);

          if (isMe) {
            cell.addEventListener("mouseenter", () => showPlacementPreview(boardEl, board, r, c));
            cell.addEventListener("click", () => handleCellPlacement(r, c));
          }
          boardEl.appendChild(cell);
        }
      }

      if (isMe) {
        boardEl.addEventListener("mouseleave", () => clearPreviewOverlay(boardEl));
      }
    }

    function showPlacementPreview(boardEl, board, startR, startC) {
      clearPreviewOverlay(boardEl);

      if (selectedPieceIndex === null || !roomState) return;

      const me = roomState.players[localPlayerId];
      if (!me || !me.rack) return;

      const shape = me.rack[selectedPieceIndex];
      if (!shape) return;

      let isValid = true;
      const targetCells = [];

      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[0].length; c++) {
          if (shape[r][c] === 1) {
            const tr = startR + r;
            const tc = startC + c;

            if (tr >= 8 || tc >= 8 || !board || board[tr][tc] === 1) {
              isValid = false;
            }

            if (tr < 8 && tc < 8) {
              targetCells.push({ tr, tc });
            }
          }
        }
      }

      const previewClass = isValid ? 'preview-valid' : 'preview-invalid';
      targetCells.forEach(({ tr, tc }) => {
        const target = boardEl.querySelector(`[data-row="${tr}"][data-col="${tc}"]`);
        if (target) {
          target.classList.add(previewClass);
        }
      });
    }

    function renderRack(role, rack, isMe) {
      const rackEl = document.getElementById(`rack-${role}`);
      rackEl.innerHTML = "";

      if (!isMe) {
        rackEl.innerHTML = `<span style='font-size:0.8rem; color:var(--text-muted);'>${t('statusCooking')}</span>`;
        return;
      }

      rack.forEach((shape, idx) => {
        if (!shape) return;
        const preview = document.createElement("div");
        preview.className = "piece-preview";
        if (selectedPieceIndex === idx) preview.classList.add("selected");

        preview.style.gridTemplateColumns = `repeat(${shape[0].length}, 14px)`;
        preview.style.gridTemplateRows = `repeat(${shape.length}, 14px)`;

        shape.forEach(row => {
          row.forEach(val => {
            const dot = document.createElement("div");
            dot.className = "preview-cell";
            dot.style.background = val === 1 ? (role === "p1" ? "var(--p1)" : "var(--p2)") : "transparent";
            preview.appendChild(dot);
          });
        });

        preview.addEventListener("click", () => {
          selectedPieceIndex = selectedPieceIndex === idx ? null : idx;
          const myBoard = document.getElementById(`board-${role}`);
          if (myBoard) clearPreviewOverlay(myBoard);
          renderRack(role, rack, isMe);
        });

        rackEl.appendChild(preview);
      });
    }

    function handleCellPlacement(r, c) {
      if (!roomState || !roomState.started || selectedPieceIndex === null) return;

      socket.emit("place_piece", {
        pieceIndex: selectedPieceIndex,
        row: r,
        col: c
      });

      playBeep(520, 0.05);
      const myBoardEl = document.querySelector('.player-zone .board');
      if (myBoardEl) clearPreviewOverlay(myBoardEl);
      selectedPieceIndex = null;
    }
    applyLanguageStatic();

    function tryAutoReconnect() {
      const currentSavedRoom = sessionStorage.getItem('bb_room_id');
      const currentSavedId = sessionStorage.getItem('bb_player_id');
      const currentSavedName = sessionStorage.getItem('bb_player_name');

      if (currentSavedRoom && currentSavedId) {
        socket.emit('join_room', {
          roomId: currentSavedRoom,
          playerName: currentSavedName,
          playerId: currentSavedId
        });
      }
    }

    socket.on('connect', tryAutoReconnect);
    if (socket.connected) tryAutoReconnect();
  </script>
</body>

</html>
